providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.12"

[phases.setup]
nixPkgs = ["...", "nodejs_22"]

[phases.build]
cmds = [
  "rm -rf frontend/node_modules",
  "npm --prefix frontend install --include=optional",
  "npm --prefix frontend install --no-save @rolldown/binding-linux-x64-gnu",
  "npm --prefix frontend run build",
]
