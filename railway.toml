[build]
builder = "NIXPACKS"

[deploy]
startCommand = "cd backend && python reset_schema.py && python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi --bind 0.0.0.0:$PORT"
restartPolicyType = "ON_FAILURE"
healthcheckPath = "/admin/login/"
healthcheckTimeout = 120
