<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة المريض — دكتورة طيبة</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">ط</div>
        <span>دكتورة طيبة</span>
      </div>
      <nav>
        <button class="tab-btn active" data-tab="assessment">استمارة التقييم</button>
        <button class="tab-btn" data-tab="plan">الخطة الغذائية</button>
        <button class="tab-btn" data-tab="followup">ملف المتابعة</button>
      </nav>
      <div style="margin-top:auto;padding-top:2rem">
        <p class="muted" id="who" style="color:#d1d5db"></p>
        <button class="btn btn-secondary btn-sm" id="logout" style="width:100%">خروج</button>
      </div>
    </aside>
    <main class="main">
      <div class="toolbar">
        <div>
          <h2 style="margin:0" id="pageTitle">استمارة التقييم</h2>
          <p class="muted" id="fileInfo"></p>
        </div>
      </div>
      <div id="alert" hidden></div>
      <div class="tabs-content">
        <section class="tab-pane active" id="tab-assessment">
          <div class="panel">
            <p class="muted" id="lockNote">بعد الحفظ الأول تُقفل الاستمارة ولا يمكن تعديلها إلا من العيادة.</p>
            <form id="assessmentForm">
              <div class="grid-3">
                <div class="field"><label>الوزن (كغ)</label><input name="weight" type="number" step="0.1" /></div>
                <div class="field"><label>الطول (سم)</label><input name="height" type="number" step="0.1" /></div>
                <div class="field"><label>محيط الخصر (سم)</label><input name="waist" type="number" step="0.1" /></div>
                <div class="field"><label>محيط الورك (سم)</label><input name="hip" type="number" step="0.1" /></div>
                <div class="field"><label>أيام الرياضة أسبوعياً</label><input name="sport_days_per_week" type="number" min="0" max="7" /></div>
                <div class="field"><label>ساعات النوم</label><input name="sleep_hours" type="number" step="0.5" /></div>
                <div class="field"><label>مستوى التوتر</label><input name="stress_level" /></div>
                <div class="field">
                  <label>الهدف</label>
                  <select name="goal">
                    <option value="">—</option>
                    <option value="lose">نزول وزن</option>
                    <option value="maintain">ثبات وزن</option>
                    <option value="gain">زيادة وزن</option>
                  </select>
                </div>
              </div>
              <div class="field"><label>التاريخ الطبي</label><textarea name="medical_history"></textarea></div>
              <div class="field"><label>الأدوية</label><textarea name="medications"></textarea></div>
              <div class="field"><label>المكملات</label><textarea name="supplements"></textarea></div>
              <div class="field"><label>نمط الحياة</label><textarea name="lifestyle_notes"></textarea></div>
              <div class="field"><label>عادات الأكل</label><textarea name="eating_habits"></textarea></div>
              <div class="stat-strip" id="computedStats"></div>
              <div class="form-actions">
                <button class="btn btn-primary" type="submit" id="saveAssessment">حفظ الاستمارة</button>
              </div>
            </form>
          </div>
        </section>

        <section class="tab-pane" id="tab-plan">
          <div class="panel" id="planBox"></div>
        </section>

        <section class="tab-pane" id="tab-followup">
          <div class="panel" id="followBox"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="/static/api.js"></script>
  <script>
    const user = requireRole(["patient"], "/");
    let patient = null;

    $("#logout").onclick = () => { API.clearSession(); location.href = "/"; };

    $$(".tab-btn").forEach((btn) => {
      btn.onclick = () => {
        $$(".tab-btn").forEach((b) => b.classList.remove("active"));
        $$(".tab-pane").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        $(`#tab-${btn.dataset.tab}`).classList.add("active");
        const titles = { assessment: "استمارة التقييم", plan: "الخطة الغذائية", followup: "ملف المتابعة" };
        $("#pageTitle").textContent = titles[btn.dataset.tab];
      };
    });

    function fillForm(form, data) {
      if (!data) return;
      [...form.elements].forEach((el) => {
        if (!el.name || !(el.name in data)) return;
        el.value = data[el.name] ?? "";
      });
    }

    function renderReadOnly(locked) {
      const form = $("#assessmentForm");
      [...form.elements].forEach((el) => {
        if (el.tagName === "BUTTON") return;
        el.disabled = locked;
      });
      $("#saveAssessment").hidden = locked;
      $("#lockNote").textContent = locked
        ? "الاستمارة مقفلة. للتعديل راجعي العيادة."
        : "بعد الحفظ الأول تُقفل الاستمارة ولا يمكن تعديلها إلا من العيادة.";
    }

    function renderPlan(plan) {
      if (!plan || !plan.daily_calories) {
        $("#planBox").innerHTML = `<div class="empty">لم تُوضع خطة غذائية بعد.</div>`;
        return;
      }
      $("#planBox").innerHTML = `
        <h3>خطتك الغذائية</h3>
        <div class="stat-strip">
          <div class="stat"><span class="muted">السعرات اليومية</span><strong>${plan.daily_calories}</strong></div>
          <div class="stat"><span class="muted">بروتين</span><strong>${plan.protein_pct ?? "—"}%</strong></div>
          <div class="stat"><span class="muted">كاربوهيدرات</span><strong>${plan.carbs_pct ?? "—"}%</strong></div>
          <div class="stat"><span class="muted">دهون</span><strong>${plan.fat_pct ?? "—"}%</strong></div>
        </div>
        <p>${plan.notes || ""}</p>
      `;
    }

    function renderFollow(f) {
      if (!f) {
        $("#followBox").innerHTML = `<div class="empty">لا توجد بيانات متابعة بعد.</div>`;
        return;
      }
      const labs = f.lab_results || {};
      const labHtml = Object.keys(labs).length
        ? `<ul>${Object.entries(labs).map(([k,v]) => `<li><strong>${k}:</strong> ${v}</li>`).join("")}</ul>`
        : "<p class='muted'>لا نتائج تحاليل حالياً.</p>";
      $("#followBox").innerHTML = `
        <h3>ملف المتابعة</h3>
        <h4>التحاليل الحالية</h4>${labHtml}
        <h4>العلاج</h4>
        <p><strong>الإبر:</strong> ${(f.injections || []).join("، ") || "—"}</p>
        <p><strong>الأدوية والمكملات:</strong> ${f.medications_text || "—"}</p>
        <p><strong>جلسات تكسير الشحم:</strong> ${f.fat_dissolving_sessions ? "نعم" : "لا"}</p>
        <p><strong>النظام الغذائي الموصوف:</strong> ${f.diet_system || "—"}</p>
        <p><strong>المتابعة القادمة:</strong> ${f.next_followup_value || "—"} ${f.next_followup_unit === "day" ? "يوم" : f.next_followup_unit === "week" ? "أسبوع" : ""}</p>
        <p class="muted">الموعد التقديري: ${f.estimated_next_visit ? formatDateTime(f.estimated_next_visit) : "—"}</p>
      `;
    }

    async function load() {
      patient = await API.get("/patients/me/");
      $("#who").textContent = patient.full_name;
      $("#fileInfo").textContent = `رقم الملف: ${patient.file_number}`;
      fillForm($("#assessmentForm"), patient.assessment || {});
      const a = patient.assessment || {};
      $("#computedStats").innerHTML = `
        <div class="stat"><span class="muted">BMI</span><strong>${a.bmi ?? "—"}</strong><div class="muted">${a.bmi_class || ""}</div></div>
        <div class="stat"><span class="muted">WHR</span><strong>${a.whr ?? "—"}</strong><div class="muted">${a.whr_class || ""}</div></div>
        <div class="stat"><span class="muted">النشاط</span><strong>${a.activity_level || "—"}</strong></div>
      `;
      renderReadOnly(!!a.is_submitted);
      renderPlan(patient.nutrition_plan);
      renderFollow(patient.follow_up);
    }

    $("#assessmentForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const payload = Object.fromEntries(fd.entries());
      ["weight","height","waist","hip","sport_days_per_week","sleep_hours"].forEach((k) => {
        if (payload[k] === "") delete payload[k];
        else if (payload[k] != null) payload[k] = Number(payload[k]);
      });
      try {
        await API.patch(`/patients/${patient.id}/assessment/`, payload);
        showAlert($("#alert"), "تم حفظ الاستمارة بنجاح.", "ok");
        await load();
      } catch (err) {
        showAlert($("#alert"), err.message);
      }
    });

    load().catch((err) => showAlert($("#alert"), err.message));
  </script>
</body>
</html>
