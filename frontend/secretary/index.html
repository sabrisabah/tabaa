<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dr. Taiba — Secretary Login</title>
  <link rel="stylesheet" href="/static/auth.css" />
</head>
<body class="auth-body">
  <div class="auth-bg" aria-hidden="true">
    <div class="shade"></div>
    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
    <div class="shape s4"></div>
    <div class="shape s5"></div>
    <div class="ring"></div>
    <div class="zig"></div>
  </div>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <span><span class="mark">T</span> Dr. Taiba</span>
      </div>
      <h1>Login</h1>
      <p style="margin:-0.6rem 0 1.1rem;color:rgba(255,255,255,.8);font-size:.92rem">Secretary portal</p>
      <div class="auth-alert" id="alert"></div>
      <form id="loginForm">
        <div class="auth-field">
          <label for="email">Email</label>
          <input id="email" name="identifier" type="email" placeholder="username@gmail.com" required />
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" placeholder="Password" required />
            <button type="button" class="toggle-pass" data-target="password" aria-label="Show password">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="auth-row">
          <a class="auth-link" href="#" id="forgotLink">Forgot Password?</a>
        </div>
        <button class="auth-btn" type="submit">Sign in</button>
      </form>
      <p class="auth-footer" style="margin-top:1.15rem"><a class="auth-link" href="/">Back to home</a></p>
    </div>
  </div>

  <script src="/static/api.js"></script>
  <script>
    if (API.getUser()?.role === "secretary" && API.getToken()) location.href = "/secretary/app/";

    function showAlert(msg) {
      const el = $("#alert");
      el.textContent = msg;
      el.classList.add("show");
    }

    $(".toggle-pass").onclick = () => {
      const input = $("#password");
      input.type = input.type === "password" ? "text" : "password";
    };
    $("#forgotLink").onclick = (e) => { e.preventDefault(); showAlert("Contact the clinic admin to reset your password."); };

    $("#loginForm").onsubmit = async (e) => {
      e.preventDefault();
      $("#alert").classList.remove("show");
      const fd = new FormData(e.target);
      try {
        const data = await API.login(fd.get("identifier"), fd.get("password"));
        if (data.user.role !== "secretary") throw new Error("This account is not a secretary account.");
        API.setSession(data);
        location.href = "/secretary/app/";
      } catch (err) {
        showAlert(err.message);
      }
    };
  </script>
</body>
</html>
